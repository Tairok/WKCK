<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - Hardware Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .auth-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .auth-header p {
            color: #999;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }

        button {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #f0f0f0;
            margin-bottom: 24px;
        }

        .tab-button {
            flex: 1;
            padding: 12px;
            border: none;
            background: none;
            color: #999;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 10px 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            font-size: 13px;
            border-left: 3px solid #c33;
        }

        .success-message {
            background: #efe;
            color: #3c3;
            padding: 10px 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            font-size: 13px;
            border-left: 3px solid #3c3;
        }

        .loading {
            display: none;
        }

        .loading.active {
            display: inline-block;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 13px;
        }

        .mfa-setup {
            text-align: center;
            margin-bottom: 16px;
        }

        .mfa-setup .qr svg {
            width: 180px;
            height: 180px;
        }

        .mfa-setup .secret {
            display: inline-block;
            margin-top: 8px;
            word-break: break-all;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            cursor: pointer;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>🖥️ Monitor</h1>
                <p>Hardware Monitoring System</p>
            </div>

            <div class="tabs">
                <button class="tab-button active" data-tab="login" onclick="switchTab('login')">Login</button>
                <button class="tab-button" data-tab="register" onclick="switchTab('register')">Register</button>
            </div>

            <!-- MFA Tab (shown after password step) -->
            <div id="mfa-tab" class="tab-content">
                <form id="mfa-form" onsubmit="handleMfa(event)">
                    <div id="mfa-message"></div>
                    <div id="mfa-setup" class="mfa-setup"></div>

                    <div class="form-group">
                        <label for="mfa-code">Kod z aplikacji (6 cyfr)</label>
                        <input type="text" id="mfa-code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" required>
                    </div>

                    <div class="button-group">
                        <button type="submit" class="btn-primary">
                            <span id="mfa-button-text">Verify</span>
                            <span class="loading" id="mfa-loading">
                                <span class="spinner"></span>
                            </span>
                        </button>
                    </div>
                </form>
            </div>

            <!-- Login Tab -->
            <div id="login-tab" class="tab-content active">
                <form id="login-form" onsubmit="handleLogin(event)">
                    <div id="login-message"></div>

                    <div class="form-group">
                        <label for="login-username">Username</label>
                        <input type="text" id="login-username" name="username" required autofocus>
                    </div>

                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" name="password" required>
                    </div>

                    <div class="button-group">
                        <button type="submit" class="btn-primary">
                            <span id="login-button-text">Sign In</span>
                            <span class="loading" id="login-loading">
                                <span class="spinner"></span>
                            </span>
                        </button>
                    </div>
                </form>
            </div>

            <!-- Register Tab -->
            <div id="register-tab" class="tab-content">
                <form id="register-form" onsubmit="handleRegister(event)">
                    <div id="register-message"></div>

                    <div class="form-group">
                        <label for="register-username">Username</label>
                        <input type="text" id="register-username" name="username" required autofocus>
                    </div>

                    <div class="form-group">
                        <label for="register-email">Email</label>
                        <input type="email" id="register-email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="register-password">Password (min. 6 characters)</label>
                        <input type="password" id="register-password" name="password" required>
                    </div>

                    <div class="form-group">
                        <label for="register-password-confirm">Confirm Password</label>
                        <input type="password" id="register-password-confirm" name="password_confirm" required>
                    </div>

                    <div class="button-group">
                        <button type="submit" class="btn-primary">
                            <span id="register-button-text">Create Account</span>
                            <span class="loading" id="register-loading">
                                <span class="spinner"></span>
                            </span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(el => el.classList.remove('active'));

            document.getElementById(tab + '-tab').classList.add('active');
            const button = document.querySelector(`.tab-button[data-tab="${tab}"]`);
            if (button) button.classList.add('active');
        }

        function setBusy(prefix, busy) {
            document.getElementById(prefix + '-loading').classList.toggle('active', busy);
            document.getElementById(prefix + '-button-text').style.display = busy ? 'none' : 'inline';
        }

        function setMessage(id, html) {
            document.getElementById(id).innerHTML = html;
        }

        async function postJson(path, body) {
            const response = await fetch(`${API_BASE}${path}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
                credentials: 'include'
            });
            return { ok: response.ok, status: response.status, data: await response.json() };
        }

        // Switch to the MFA step. When setup_required, also show the QR code to scan.
        function showMfaStep(data) {
            document.querySelector('.tabs').style.display = 'none';
            switchTab('mfa');

            const setupEl = document.getElementById('mfa-setup');
            if (data.setup_required) {
                setupEl.innerHTML = `
                    <p>Zeskanuj kod QR w aplikacji uwierzytelniającej albo wpisz klucz ręcznie, a następnie podaj kod z aplikacji.</p>
                    <div class="qr">${data.qr_svg}</div>
                    <code class="secret">${data.secret}</code>`;
                setupEl.style.display = '';
            } else {
                setupEl.innerHTML = '';
                setupEl.style.display = 'none';
            }
            document.getElementById('mfa-code').focus();
        }

        async function handleLogin(e) {
            e.preventDefault();

            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            setMessage('login-message', '');
            setBusy('login', true);

            try {
                const { ok, data } = await postJson('/api/auth/login', { username, password });

                if (!ok) {
                    setMessage('login-message', `<div class="error-message">${data.error || 'Login failed'}</div>`);
                    setBusy('login', false);
                    return;
                }

                setBusy('login', false);
                showMfaStep(data);
            } catch (error) {
                setMessage('login-message', `<div class="error-message">Connection error</div>`);
                setBusy('login', false);
            }
        }

        async function handleRegister(e) {
            e.preventDefault();

            const username = document.getElementById('register-username').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const passwordConfirm = document.getElementById('register-password-confirm').value;

            setMessage('register-message', '');
            setBusy('register', true);

            try {
                const { ok, data } = await postJson('/api/auth/register', {
                    username,
                    email,
                    password,
                    password_confirm: passwordConfirm
                });

                if (!ok) {
                    setMessage('register-message', `<div class="error-message">${data.error || 'Registration failed'}</div>`);
                    setBusy('register', false);
                    return;
                }

                setBusy('register', false);
                showMfaStep(data);
            } catch (error) {
                setMessage('register-message', `<div class="error-message">Connection error</div>`);
                setBusy('register', false);
            }
        }

        async function handleMfa(e) {
            e.preventDefault();

            const code = document.getElementById('mfa-code').value;

            setMessage('mfa-message', '');
            setBusy('mfa', true);

            try {
                const { ok, status, data } = await postJson('/api/auth/mfa/verify', { code });

                if (!ok) {
                    // Challenge expired or used up: start over from the password step
                    if (status === 401 && data.error !== 'Invalid code') {
                        window.location.href = '/auth/login';
                        return;
                    }
                    setMessage('mfa-message', `<div class="error-message">${data.error || 'Verification failed'}</div>`);
                    setBusy('mfa', false);
                    return;
                }

                setMessage('mfa-message', `<div class="success-message">✓ ${data.message}</div>`);
                setTimeout(() => {
                    window.location.href = '/';
                }, 800);
            } catch (error) {
                setMessage('mfa-message', `<div class="error-message">Connection error</div>`);
                setBusy('mfa', false);
            }
        }

        // Only the first user can register; once users exist, show the login tab only
        async function init() {
            try {
                const response = await fetch(`${API_BASE}/api/auth/status`, { credentials: 'include' });
                const { has_users } = await response.json();

                if (has_users) {
                    document.querySelector('.tab-button[data-tab="register"]').style.display = 'none';
                    switchTab('login');
                } else {
                    document.querySelector('.tab-button[data-tab="login"]').style.display = 'none';
                    switchTab('register');
                }
            } catch (error) {
                switchTab('login');
            }
        }

        init();
    </script>
</body>
</html>
