<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - Hardware Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .auth-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .auth-header p {
            color: #999;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }

        button {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #f0f0f0;
            margin-bottom: 24px;
        }

        .tab-button {
            flex: 1;
            padding: 12px;
            border: none;
            background: none;
            color: #999;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 10px 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            font-size: 13px;
            border-left: 3px solid #c33;
        }

        .success-message {
            background: #efe;
            color: #3c3;
            padding: 10px 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            font-size: 13px;
            border-left: 3px solid #3c3;
        }

        .loading {
            display: none;
        }

        .loading.active {
            display: inline-block;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 13px;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            cursor: pointer;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>🖥️ Monitor</h1>
                <p>Hardware Monitoring System</p>
            </div>

            <div class="tabs">
                <button class="tab-button active" onclick="switchTab('login')">Login</button>
                <button class="tab-button" onclick="switchTab('register')">Register</button>
            </div>

            <!-- Login Tab -->
            <div id="login-tab" class="tab-content active">
                <form id="login-form" onsubmit="handleLogin(event)">
                    <div id="login-message"></div>

                    <div class="form-group">
                        <label for="login-username">Username</label>
                        <input type="text" id="login-username" name="username" required autofocus>
                    </div>

                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" name="password" required>
                    </div>

                    <div class="button-group">
                        <button type="submit" class="btn-primary">
                            <span id="login-button-text">Sign In</span>
                            <span class="loading" id="login-loading">
                                <span class="spinner"></span>
                            </span>
                        </button>
                    </div>
                </form>
            </div>

            <!-- Register Tab -->
            <div id="register-tab" class="tab-content">
                <form id="register-form" onsubmit="handleRegister(event)">
                    <div id="register-message"></div>

                    <div class="form-group">
                        <label for="register-username">Username</label>
                        <input type="text" id="register-username" name="username" required autofocus>
                    </div>

                    <div class="form-group">
                        <label for="register-email">Email</label>
                        <input type="email" id="register-email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="register-password">Password (min. 6 characters)</label>
                        <input type="password" id="register-password" name="password" required>
                    </div>

                    <div class="form-group">
                        <label for="register-password-confirm">Confirm Password</label>
                        <input type="password" id="register-password-confirm" name="password_confirm" required>
                    </div>

                    <div class="button-group">
                        <button type="submit" class="btn-primary">
                            <span id="register-button-text">Create Account</span>
                            <span class="loading" id="register-loading">
                                <span class="spinner"></span>
                            </span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(el => el.classList.remove('active'));

            document.getElementById(tab + '-tab').classList.add('active');
            event.target.classList.add('active');
        }

        async function handleLogin(e) {
            e.preventDefault();

            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const messageEl = document.getElementById('login-message');
            const loadingEl = document.getElementById('login-loading');
            const buttonTextEl = document.getElementById('login-button-text');

            messageEl.innerHTML = '';
            loadingEl.classList.add('active');
            buttonTextEl.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                    credentials: 'include'
                });

                const data = await response.json();

                if (!response.ok) {
                    messageEl.innerHTML = `<div class="error-message">${data.error || 'Login failed'}</div>`;
                    loadingEl.classList.remove('active');
                    buttonTextEl.style.display = 'inline';
                    return;
                }

                messageEl.innerHTML = `<div class="success-message">✓ ${data.message}</div>`;

                // Redirect to dashboard after 1 second
                setTimeout(() => {
                    window.location.href = '/';
                }, 1000);
            } catch (error) {
                messageEl.innerHTML = `<div class="error-message">Connection error</div>`;
                loadingEl.classList.remove('active');
                buttonTextEl.style.display = 'inline';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();

            const username = document.getElementById('register-username').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            const passwordConfirm = document.getElementById('register-password-confirm').value;
            const messageEl = document.getElementById('register-message');
            const loadingEl = document.getElementById('register-loading');
            const buttonTextEl = document.getElementById('register-button-text');

            messageEl.innerHTML = '';
            loadingEl.classList.add('active');
            buttonTextEl.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username,
                        email,
                        password,
                        password_confirm: passwordConfirm
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    messageEl.innerHTML = `<div class="error-message">${data.error || 'Registration failed'}</div>`;
                    loadingEl.classList.remove('active');
                    buttonTextEl.style.display = 'inline';
                    return;
                }

                messageEl.innerHTML = `<div class="success-message">✓ Account created! Redirecting to login...</div>`;

                // Clear form
                document.getElementById('register-form').reset();

                // Switch to login tab
                setTimeout(() => {
                    document.getElementById('login-tab').classList.add('active');
                    document.getElementById('register-tab').classList.remove('active');
                    document.querySelectorAll('.tab-button')[0].classList.add('active');
                    document.querySelectorAll('.tab-button')[1].classList.remove('active');
                    document.getElementById('login-username').value = username;
                    document.getElementById('login-username').focus();
                }, 1500);
            } catch (error) {
                messageEl.innerHTML = `<div class="error-message">Connection error</div>`;
                loadingEl.classList.remove('active');
                buttonTextEl.style.display = 'inline';
            }
        }
    </script>
</body>
</html>
